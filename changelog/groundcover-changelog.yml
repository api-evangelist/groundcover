  - date: '2026-08-27'
    source: https://github.com/groundcover-com/groundcover-sdk-go
    version: v1.410.0
    breaking: true
    change: >-
      Breaking change AI-461 — the public Go SDK removed CreateWorkflow, ListWorkflows and
      DeleteWorkflow, dropping POST /api/workflows/create, POST /api/workflows/list and
