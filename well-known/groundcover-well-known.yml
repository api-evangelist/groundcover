provider: Groundcover
providerId: groundcover
description: 'Well-known document probe for groundcover. Two documents are genuinely served: the OAuth
  2.0 Authorization Server Metadata (RFC 8414) and OAuth 2.0 Protected Resource Metadata (RFC 9728) that
  back the remote MCP server at https://mcp.groundcover.com/api/mcp. They answer on both mcp.groundcover.com
  and app.groundcover.com with byte-identical bodies. Everything else 404s. api.groundcover.com is not
  a 404 host: its edge rejects every unauthenticated request, including /.well-known/*, with HTTP 400
  {"message":"Missing Authorization header"} — so no well-known document can be read there anonymously.
  www.groundcover.com answers every /.well-known/* path with an HTML page reading "Invalid .well-known
  request" under a 404; docs.groundcover.com (GitBook) answers with its 404 SPA shell.'
