specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Groundcover
providerId: groundcover
generated: '2026-08-29'
method: searched
source: https://www.groundcover.com/pricing
created: '2026-05-04'
modified: '2026-08-29'
tags:
  - AIOps
  - Observability
  - Kubernetes
description: >-
  groundcover prices on monitored HOSTS, not on ingested data volume — the monthly average number of
  Kubernetes or Linux hosts actively monitored by the eBPF sensor, of any size or machine type. That
  is the whole commercial thesis: because the BYOC architecture keeps storage and processing inside
  the customer's own VPC, groundcover does not pay for the data and does not meter it. API access is
  not separately priced or metered; every tier reaches the same API, and quotas are expressed as
  data retention and feature availability rather than as request counts. Replaces the 2026-05-04
  scaffold, which carried invented per-request quotas.
pricing_model: per monitored host per month
billing_periods: [monthly, yearly]
marketplaces:
  - Amazon Web Services
  - Google Cloud Platform
  - Microsoft Azure
plan_count: 4
plans:
  - id: groundcover-free
    name: Free
    type: freemium
    price: '0.00'
    currency: USD
    unit: per host
    timeFrame: month
    deployment_mode: BYOC
    description: Free forever entry tier. No credit card required.
    entries:
      - label: Data retention
        name: data_retention
        type: quota
        metric: retention_hours
        limit: 12
        timeFrame: hour
      - label: Support
        name: support
        type: feature
        value: Slack Community
    elements:
      - name: 12 hour data retention
      - name: Slack Community support
      - name: No credit card required
  - id: groundcover-pro
    name: Pro
    type: paid
    price: '30.00'
    currency: USD
    unit: per host
    timeFrame: month
    deployment_mode: BYOC
    description: For teams of all sizes who like to move fast.
    entries:
      - label: Data retention
        name: data_retention
        type: quota
        metric: retention
        limit: standard
      - label: Support
        name: support
        type: feature
        value: Standard support
    elements:
      - name: All available integrations and data sources
      - name: SSO support
      - name: Standard data retention
      - name: Standard support
  - id: groundcover-enterprise
    name: Enterprise
    type: paid
    price: '35.00'
    currency: USD
    unit: per host
    timeFrame: month
    deployment_mode: BYOC
    description: For orgs in need of reliability at scale. Everything in Pro, plus the items below.
    entries:
      - label: Data retention
        name: data_retention
        type: quota
        metric: retention
        limit: unlimited
      - label: Support
        name: support
        type: feature
        value: Premium support
    elements:
      - name: RBAC support
      - name: Unlimited data retention
      - name: Premium support
    note: >-
      RBAC — and therefore scoped service accounts and narrowed API keys — is an Enterprise
      capability. On Free and Pro, API credentials cannot be constrained by policy.
  - id: groundcover-on-premise
    name: On Premise
    type: paid
    price: '50.00'
    currency: USD
    unit: per host
    timeFrame: month
    deployment_mode: Full On-Prem
    description: >-
      Designed for high-compliance or regulated environments. Everything in Enterprise, plus a
      self-hosted data plane, self-hosted UI and isolated authentication. Sold through Contact us.
    elements:
      - name: Self-hosted data plane
      - name: Self-hosted UI
      - name: Isolated authentication
    note: >-
      On-prem and air-gapped deployments run their own API and MCP URLs and issue their own keys —
      api.groundcover.com and mcp.groundcover.com do not apply.
billing_notes:
  - >-
    A billable host is a Kubernetes host or any Linux host of any size actively monitored by the
    platform.
  - >-
    Billing uses the monthly AVERAGE number of monitored hosts, so short-lived peaks are not
    charged at peak.
  - Custom billing plans are available through sales.
  - A public cost calculator on the pricing page estimates total cost of ownership including BYOC hosting.
api_metering:
  metered: false
  note: >-
    No plan meters API requests, and no per-tier API quota is published. The only published API
    limit is a flat per-key rate limit that the pricing page does not differentiate by tier — see
    rate-limits/groundcover-rate-limits.yml.
