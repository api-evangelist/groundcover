aid: groundcover
name: Groundcover
description: >-
  groundcover is a cloud-native observability platform that uses eBPF for zero-instrumentation
  monitoring of Kubernetes and Linux workloads, covering logs, metrics, traces, Kubernetes events,
  real user monitoring, synthetics and AI/LLM observability. Its BYOC (bring your own cloud)
  architecture keeps the data plane inside the customer's own VPC, which lets it price per
  monitored host rather than per ingested byte. Programmatic access is delivered through a REST
  API at api.groundcover.com (gcQL search endpoints for logs, traces and Kubernetes events, a
  Prometheus-compatible metrics API, and management endpoints for monitors, silences, ingestion
  keys and pipelines), a remote MCP server at mcp.groundcover.com for agents, official Go,
  Python and TypeScript SDKs, a CLI, and Terraform, Pulumi and Crossplane providers.
