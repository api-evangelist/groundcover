apis:
  - aid: groundcover:groundcover
    name: Groundcover
    description: >-
      The groundcover platform REST API. Data query endpoints run gcQL pipelines against logs
      (POST /api/logs/v2/search), trace spans (POST /api/traces/v2/search) and Kubernetes events
      (POST /api/k8s/v2/events/search); metrics are queried through a Prometheus-compatible API.
      Management endpoints cover monitors, one-time and recurring silences, workflows, ingestion
      keys, API keys, service accounts, RBAC policies, dashboards, destinations, notification
      routes, storage management, synthetics, RUM and log/trace/metric pipelines. Authentication
      is a service-account API key sent as a bearer token, with X-Backend-Id routing for accounts
      that own more than one backend.
    humanURL: https://docs.groundcover.com/use-groundcover/remote-access-and-apis/api-examples
