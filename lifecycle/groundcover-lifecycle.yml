method: searched
source: https://docs.groundcover.com and https://www.groundcover.com/changelog
provider: Groundcover
providerId: groundcover
description: >-
  Versioning, deprecation and operational-transparency posture for the groundcover API. groundcover
  runs an unusually explicit deprecation practice for a company of its size — deprecated surfaces
  carry an in-page warning, a named successor and a step-by-step migration guide — but it publishes
  no status page and no dated sunset commitments.
versioning:
  scheme: per-resource path segment (v2, v3); several management paths are unversioned
  current:
    logs: /api/logs/v2/search
    traces: /api/traces/v2/search
    kubernetes_events: /api/k8s/v2/events/search
    kubernetes_resources: /api/k8s/v3/*
  policy_published: false
  note: >-
    No document states how long a version is supported, how a new version is announced, or whether
    breaking changes can land inside a version.
deprecation:
  policy_published: true
  policy_style: per-surface notice plus migration guide (no dated sunset, no Sunset/Deprecation headers)
  rfc8594_headers: false
  documented_deprecations:
    - surface: Workflows
      endpoints:
        - POST /api/workflows/create
        - POST /api/workflows/list
        - DELETE /api/workflows/{id}
      status: deprecated
      successor: Destinations (formerly Connected Apps) + Notification Routes
      migration_guide: https://docs.groundcover.com/use-groundcover/workflows
      sunset_date: not published
      statement: >-
        "Workflows are deprecated. We recommend migrating to Notification Routes and Destinations...
        New features and bug fixes are only being applied to the new system."
      client_impact: >-
        The official Go SDK removed CreateWorkflow, ListWorkflows and DeleteWorkflow as a declared
        breaking change (AI-461). The endpoints still answer over raw REST for compatibility.
      soft_disable: 'Add a filter that matches nothing (e.g. key: _never_match_) to disable a workflow without deleting it.'
    - surface: Datasource (ds) API keys / legacy ClickHouse API
      endpoint: https://ds.groundcover.com
      status: deprecated
      successor: gcQL search endpoints on api.groundcover.com
      statement: 'The following configurations are deprecated but may still be in use in older setups.'
      docs: https://docs.groundcover.com/use-groundcover/remote-access-and-apis/raw-prometheus-and-clickhouse
      sunset_date: not published
    - surface: Issues page (pre-Monitors)
      status: migrated
      successor: Monitors Issues page
      docs: https://docs.groundcover.com/use-groundcover/monitors/migrating-from-issues-to-monitors-issues-page
status_page:
  published: false
  probed:
    - url: https://status.groundcover.com/
