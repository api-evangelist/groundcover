  probed_on: '2026-08-29'
  note: >-
    A BYOC vendor whose data plane runs inside the customer's own VPC has a genuinely smaller shared
    control plane to report on, but the console, the API host and the MCP endpoint are all
    groundcover-operated and currently have no public uptime surface.
