provider: Groundcover
providerId: groundcover
description: >-
  Crosswalk between groundcover's remote MCP tools and its REST API. IMPORTANT CAVEAT ON SHAPE:
  groundcover publishes no OpenAPI, so the `rest:` column carries documented METHOD + PATH pairs
  rather than operationIds — there are no operationIds to cite. Both sides are gated (MCP tools/list
  returns 401 without a token; api.groundcover.com returns 400 without an Authorization header), so
  bindings are matched by documented name and semantics, not by comparing live schemas. Confidence
  is set accordingly.
surfaces:
  openapi:
    published: false
    note: >-
      No public OpenAPI. Probed https://api.groundcover.com/openapi.json, /openapi.yaml,
      /swagger.json, /v1/openapi.json, /api-docs, /docs and https://docs.groundcover.com/openapi.json
      on 2026-08-29 — the api host returns 400 "Missing Authorization header" for every path and the
      docs host returns its GitBook 404 shell. The SDK release workflows generate from an internal
      spec published to a private S3 bucket (groundcover-openapi-sdk-bucket), which is not readable.
    evidence_of_size: >-
      The official Go SDK (github.com/groundcover-com/groundcover-sdk-go v1.410.0) is generated from
      that spec and contains 112 operations across 25 tag packages and 198 models.
  graphql:
    published: false
  mcp:
    url: https://mcp.groundcover.com/api/mcp
    gated: true
    gate: 'HTTP 401 {"message":"Failed to validate JWT"} on tools/list'
  rest:
    base_url: https://api.groundcover.com
    gated: true
    gate: 'HTTP 400 {"message":"Missing Authorization header"} on every unauthenticated path'
    docs: https://docs.groundcover.com/use-groundcover/remote-access-and-apis/api-examples
