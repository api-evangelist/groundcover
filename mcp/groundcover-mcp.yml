  overview: https://docs.groundcover.com/getting-started/groundcover-mcp
  configure: https://docs.groundcover.com/getting-started/groundcover-mcp/configure-groundcovers-mcp-server
  tools_reference: https://docs.groundcover.com/getting-started/groundcover-mcp/mcp-tools-reference
  prompts: https://docs.groundcover.com/getting-started/groundcover-mcp/getting-started-prompts
  use_cases: https://docs.groundcover.com/getting-started/groundcover-mcp/real-world-use-cases
