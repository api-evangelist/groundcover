provider: Groundcover
providerId: groundcover
description: >-
  Standards and cross-cutting conventions groundcover's own surfaces conform to. Observability has a
  genuine domain standard set — OpenTelemetry for ingest and Prometheus for metrics query — and
  groundcover conforms to both at the wire level, which is the difference between a buyer pointing
  an existing collector at it and needing a bespoke connector. Recorded from the contract surfaces
  themselves, not from marketing claims.
standards:
  - id: opentelemetry-otlp
    name: OpenTelemetry Protocol (OTLP/HTTP)
    domain_standard: true
    conforms: true
    role: ingest
    evidence:
      - >-
        Documented OTEL Collector exporter configuration uses the `otlphttp/groundcover` exporter
        with `endpoint: https://{BYOC_ENDPOINT}` and an `apikey` header — i.e. groundcover accepts
        standard OTLP/HTTP from an unmodified OpenTelemetry Collector.
      - source: https://docs.groundcover.com/integrations/data-sources/opentelemetry/sending-from-an-opentelemetry-collector
      - >-
        Separate documented paths for sending from Kubernetes pods and from standalone
        applications, plus attribute enrichment via HTTP headers.
    note: >-
      The endpoint is per-tenant ({BYOC_ENDPOINT}) by architecture, not a shared collector host —
      templated and correct, since the data plane lives in the customer's own cloud.
  - id: prometheus-http-api
    name: Prometheus HTTP API / PromQL
    domain_standard: true
    conforms: true
    role: metrics query
    evidence:
      - 'Documented endpoint: https://app.groundcover.com/api/prometheus/api/v1/query'
      - >-
        The docs explicitly refer callers to the upstream Prometheus HTTP API documentation for the
        complete operation set, which is a conformance claim against the standard rather than a
        vendor API of its own.
      - source: https://docs.groundcover.com/use-groundcover/remote-access-and-apis/raw-prometheus-and-clickhouse
    note: >-
      Metric queries are PromQL/MetricsQL. Grafana can consume groundcover as a Prometheus
      datasource, and groundcover ships a VictoriaMetrics Grafana datasource plugin.
  - id: prometheus-exposition
    name: Prometheus metric scraping
    domain_standard: true
    conforms: true
    role: ingest
    evidence:
      - Documented scraping of Prometheus-format metrics from Kubernetes pods, standalone hosts and cloud hosts.
      - source: https://docs.groundcover.com/integrations/data-sources/prometheus
  - id: mcp
    name: Model Context Protocol
    conforms: true
    role: agent interface
    evidence:
      - 'Hosted remote server: https://mcp.groundcover.com/api/mcp'
      - 'JSON-RPC 2.0 tools/list responded HTTP 401 {"message":"Failed to validate JWT"} on 2026-08-29 — a protocol-level auth rejection, not a 404.'
      - source: https://docs.groundcover.com/getting-started/groundcover-mcp/configure-groundcovers-mcp-server
  - id: oauth2
    name: OAuth 2.0 / 2.1 authorization code with PKCE
    conforms: true
    role: MCP authentication
    evidence:
      - 'https://mcp.groundcover.com/.well-known/oauth-authorization-server -> HTTP 200'
      - 'grant_types_supported: authorization_code, refresh_token; code_challenge_methods_supported: S256'
  - id: rfc8414
    name: RFC 8414 — OAuth 2.0 Authorization Server Metadata
    conforms: true
    evidence:
      - 'https://mcp.groundcover.com/.well-known/oauth-authorization-server -> HTTP 200, probed 2026-08-29'
  - id: rfc9728
    name: RFC 9728 — OAuth 2.0 Protected Resource Metadata
    conforms: true
    evidence:
      - 'https://mcp.groundcover.com/.well-known/oauth-protected-resource -> HTTP 200, scopes_supported: [access:router], probed 2026-08-29'
  - id: rfc7591
    name: RFC 7591 — OAuth 2.0 Dynamic Client Registration
    conforms: true
