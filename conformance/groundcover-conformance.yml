domain_standard_summary: >-
  groundcover's market standard is OpenTelemetry plus the Prometheus query and exposition formats,
  and it conforms to both — an existing OTEL Collector or Grafana/Prometheus consumer integrates
  with no bespoke connector. What it does not conform to is the API-description layer: no OpenAPI,
  no AsyncAPI, no RFC 9457 errors.
